  $('#fin').onclick = () => { if (corregible) { stage.innerHTML = ''; go('review', true); } else { S = fresh(); showWelcome(); } };
}
function showDone(p, ok, sinUrl, j) {
  const el = stage.firstElementChild, code = p.id.split('-').slice(1).join('-'), n = p.items.length, nm = p.items.reduce((k, it) => k + it.materias.length, 0);
  const otra = `<button class="btn prime big" id="otro"><span>Registrar otro grupo</span>${IC.plus.replace('<svg', '<svg style="stroke-width:2.6"')}</button>`;
  if (ok) {
    const dup = j && j.duplicados ? `<p class="moddesc" style="color:#ffe9a6">${j.duplicados} materia${j.duplicados === 1 ? '' : 's'} ya tenía${j.duplicados === 1 ? '' : 'n'} un registro tuyo con la misma fecha: quedaron marcadas como «posible duplicado» para que la dirección las revise.</p>` : '';
    el.innerHTML = `<div class="fin"><div class="badge"><svg viewBox="0 0 70 70"><path d="M16 36l13 13 26-28"/></svg></div>
      <div class="modlbl">Registro completo</div><h2 class="htitle" style="font-size:clamp(30px,7vw,46px)"><span class="xgrad">¡Registro enviado!</span></h2>
      <p class="hsub">Hito ${esc(p.hito)} · <b>${n}</b> estudiante${n === 1 ? '' : 's'} · <b>${nm}</b> materia${nm === 1 ? '' : 's'}. Gracias por acompañar a tus estudiantes.</p>${dup}
      <div class="receipt"><small>Código del envío</small><b>${esc(code)}</b></div><br>
      <div class="nav" style="justify-content:center;gap:12px;flex-wrap:wrap">${otra}<button class="btn ghost" id="fin"><span>Finalizar</span></button></div></div>`;
    FX.confetti();
  } else {
    el.innerHTML = `<div class="fin"><div class="badge warn"><svg viewBox="0 0 70 70"><path d="M35 18v22M35 50v1"/></svg></div>
      <div class="modlbl" style="color:var(--y)">Guardado en este equipo</div><h2 class="modtitle"><span>${sinUrl ? 'El registro aún no está conectado' : 'No pudimos conectar con el servidor'}</span></h2>
      <p class="moddesc">Tu registro quedó guardado en este dispositivo y se enviará automáticamente la próxima vez que abras esta página con internet. ${sinUrl ? '' : 'También puedes reintentar ahora.'}</p>
      <div class="receipt"><small>Código del envío</small><b>${esc(code)}</b></div><br>
      <div class="nav" style="justify-content:center;gap:12px;flex-wrap:wrap">${sinUrl ? '' : `<button class="btn prime" id="retry"><span>Reintentar envío</span>${IC.send}</button>`}<button class="btn ghost" id="fin"><span>Finalizar</span></button></div></div>`;
    const rb = $('#retry');
    if (rb) rb.onclick = async () => { rb.disabled = true; rb.querySelector('span').textContent = 'Enviando…'; const k = await flushCola(); if (k) showDone(p, true); else { rb.disabled = false; rb.querySelector('span').textContent = 'Reintentar envío'; toast('Aún sin conexión. Quedó guardado en este equipo.'); } };
  }
  const per = {correo:S.correo, perfil:S.perfil, cfg:S.cfg, materias:S.materias, carreras:S.carreras, hito:S.hito};
  const ot = $('#otro');
  if (ot) ot.onclick = () => { S = {...fresh(), ...per, id:nuevoId(), t0:Date.now()}; S.previos = {}; stage.innerHTML = ''; go('hub'); };
  $('#fin').onclick = () => { S = fresh(); showWelcome(); };
}

/* ---------- bienvenida ---------- */
function showWelcome(back) {
  S.scr = null; $('#top').classList.add('off');
  const d = lsGet(LS_DRAFT, null);
  const hasDraft = d && d.id && d.perfil && d.v === VERSION;
  const words = [['Registro', 0], ['de', 0], ['sesiones', 0], ['de', 0], ['mentoría', 1]];
  let ci = 0;
  const NG = words.filter(w => w[1]).reduce((n, w) => n + w[0].length, 0); let gi = 0;
  const title = words.map(([w, g]) => `<span class="wd${g ? ' grad' : ''}">` + w.split('').map(c => `<span class="ch" style="animation-delay:${200 + (ci++) * 26}ms${g ? `;background-position:${(gi++ / (NG - 1) * 100).toFixed(1)}% 0` : ''}">${c}</span>`).join('') + '</span>').join(' ');
  retire(back);
  const el = document.createElement('section'); el.className = 'screen' + (back ? ' back' : ''); stage.appendChild(el);
  const nd = hasDraft ? (d.items || []).length : 0;
  el.innerHTML = `<div class="hero">
    <div class="logoStage"><div class="orbit"></div><div class="orbit o2"></div><div class="logoWrap"><img src="${LOGO_FULL}" alt="UNIFRANZ · Universidad Privada Franz Tamayo"><div class="shine" id="shine"></div></div></div>
    <div class="kicker">Docentes Tutores · Hermanos Mayores · 2026</div>
    <h1 class="htitle">${title}</h1>
    <p class="hsub">Registra en un solo envío a todos los estudiantes que acompañaste en el hito, cada uno con todas sus materias. Si alguien no asistió, basta con marcarlo.</p>
    <div class="chips"><span class="chip">${IC.mail}Con tu correo UNIFRANZ</span><span class="chip">${IC.users}Varios estudiantes, <b>1</b> envío</span><span class="chip">${IC.books}Varias materias por estudiante</span><span class="chip">${IC.clock}<b>≈1</b> min por estudiante</span></div>
    ${hasDraft ? `<div class="resume">Tienes un registro sin enviar en este equipo (hito ${esc(d.hito || '–')} · ${nd} estudiante${nd === 1 ? '' : 's'}).<div class="row"><button class="btn prime" id="cont"><span>Continuar donde lo dejé</span>${IC.arrowR}</button><button class="btn ghost" id="fresh">Empezar de nuevo</button></div></div>`
      : `<button class="btn prime big" id="start" data-autofocus><span>Comenzar registro</span>${IC.arrowR}</button>`}
    <div class="hfoot">Universidad Privada Franz Tamayo · Acompañamiento académico</div>
  </div>`;
  const sh = $('#shine', el); sh.style.webkitMaskImage = sh.style.maskImage = `url(${LOGO_FULL})`;
  const start = () => { S = {...fresh(), id:nuevoId(), t0:Date.now()}; go('login'); };
  if (hasDraft) {
    $('#cont', el).onclick = () => {
      S = {...fresh(), ...d}; delete S.v;
      const sc = FICHA.includes(S.scr) && S.cur ? (S.cur.est ? S.scr : 'est') : (S.scr === 'review' && S.items.length ? 'review' : (S.hito ? 'hub' : 'hito'));
      if (!FICHA.includes(sc)) { S.cur = null; S.curIdx = -1; }
      go(sc);
    };
    $('#fresh', el).onclick = () => { lsDel(LS_DRAFT); start(); };
  } else $('#start', el).onclick = start;
  window.scrollTo({top:0});
}

/* ---------- efectos menores ---------- */
function ripple(b, e) {
  const r = b.getBoundingClientRect(), s = document.createElement('span');
  s.className = 'ripple'; s.style.left = ((e.clientX || r.left + r.width / 2) - r.left) + 'px'; s.style.top = ((e.clientY || r.top + r.height / 2) - r.top) + 'px';
  b.appendChild(s); setTimeout(() => s.remove(), 700);
}
function tilt(card) {
  if (!card || !FINE || REDUCED) return;
  card.addEventListener('pointermove', e => {
    const r = card.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    card.style.transform = `rotateX(${(.5 - py) * 2}deg) rotateY(${(px - .5) * 2.4}deg)`;
    card.style.setProperty('--mx', px * 100 + '%'); card.style.setProperty('--my', py * 100 + '%');
  });
  card.addEventListener('pointerleave', () => { card.style.transform = ''; });
}

/* teclado */
document.addEventListener('keydown', e => {
  if (!$('#admin').hidden) { if (e.key === 'Escape') $('#admin').hidden = true; return; }
  const sc = S.scr; if (!sc || sc === 'login') return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'textarea' || tag === 'input' || tag === 'select') return;
  const el = stage.lastElementChild;
  if (sc === 'asis' && /^[12]$/.test(e.key)) { const b = $$('.duo .opt', el)[+e.key - 1]; if (b) b.click(); return; }
  if (sc === 'hito' && /^[1-9]$/.test(e.key)) { const b = $$('.opt', el)[+e.key - 1]; if (b) b.click(); return; }
  if (e.key === 'Enter' && !e.target.closest('button') && sc !== 'review') { e.preventDefault(); const b = $('#btnNext', el); if (b) b.click(); }
});

/* ---------- toast / banner / admin ---------- */
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2800); }
let taps = 0, tapT;
$('#ver').addEventListener('click', () => { taps++; clearTimeout(tapT); tapT = setTimeout(() => taps = 0, 700); if (taps >= 3) { taps = 0; openAdmin(); } });
function openAdmin() {
  $('#admUrl').textContent = API_OK ? API_URL + (QS.get('api') ? '  (de ?api=)' : '  (del archivo)') : 'SIN CONFIGURAR — pega la URL /exec en API_URL_DEFECTO';
  $('#admCola').textContent = cola().length; $('#admLog').textContent = 'Listo.'; $('#admin').hidden = false;
}
const admLog = m => { const l = $('#admLog'); l.textContent += '\n' + m; l.scrollTop = 1e6; };
$('#admin').addEventListener('click', async e => {
  if (e.target.id === 'admin') return $('#admin').hidden = true;
  const b = e.target.closest('[data-adm]'); if (!b) return;
  const a = b.dataset.adm;
  if (a === 'close') return $('#admin').hidden = true;
  if (!API_OK) return admLog('Falta la URL /exec.');
  if (a === 'ping') { admLog('Ping…'); try { const j = await jsonp({action:'ping'}); admLog(JSON.stringify(j)); } catch (er) { admLog('Sin respuesta: ' + er.message + '. Revisa que la implementación tenga acceso "Cualquier persona".'); } }
  if (a === 'prueba') {
    const p = {id:'PRUEBA-' + Date.now().toString(36).toUpperCase(), correo:'prueba@unifranz.edu.bo', hito:'2', fecha_local:new Date().toLocaleString('es-BO'), dur_s:0, movil:false, version:VERSION,
      items:[{manual:{ci:'0000000', nombre:'Estudiante De Prueba', carrera_cod:'SIS', sede:'CBB'}, materias:[{cod:'PRUEBA-000', car:'SIS', nombre:'Materia de prueba'}], asistio:'Sí', fecha:isoHoy(), hi:'10:00', hf:'11:00', act:'Fila de prueba', obs:''}]};
    admLog('Escribiendo ' + p.id + '…'); try { const j = await enviar(p, admLog); admLog('OK ' + JSON.stringify(j)); } catch (er) { admLog('ERROR: ' + er.message + ' ' + (er.detalle || '')); }
  }
  if (a === 'flush') { admLog('Reenviando ' + cola().length + '…'); const n = await flushCola(admLog); admLog('Enviados: ' + n); $('#admCola').textContent = cola().length; }
});

/* =====================================================================
   EFECTOS: campo estelar con constelaciones + chispas + confeti
   ===================================================================== */
const FX = (() => {
  const c1 = $('#fx'), x1 = c1.getContext('2d'), c2 = $('#fx2'), x2 = c2.getContext('2d');
  let W = 0, H = 0, D = 1, stars = [], sparks = [], warp = 0, warpT = 0, px = .5, py = .5, run = true;
  const COLS = ['#ffffff', '#00e5ff', '#ff6b1a', '#8b5cf6', '#ff2bd6', '#39ffb0'];
  function size() {
    D = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    [c1, c2].forEach(c => { c.width = W * D; c.height = H * D; });
    x1.setTransform(D, 0, 0, D, 0, 0); x2.setTransform(D, 0, 0, D, 0, 0);
    const n = REDUCED ? 40 : (W < 600 ? 80 : 150);
    stars = Array.from({length:n}, () => mk(Math.random()));
  }
  function mk(z) { return {x:(Math.random() - .5) * 2, y:(Math.random() - .5) * 2, z: z || 1, pz: z || 1, c: Math.random() < .7 ? COLS[0] : COLS[1 + (Math.random() * 5 | 0)]}; }
  function frame() {
    if (!run) return;
    warp += (warpT - warp) * .08; warpT *= .94;
    x1.clearRect(0, 0, W, H);
    const cx = W / 2 + (px - .5) * -60, cy = H * .42 + (py - .5) * -40, F = Math.max(W, H) * .5;
    const sp = .0011 + Math.max(0, warp) * .022, pts = [];
    for (const s of stars) {
      s.pz = s.z; s.z -= sp * (warp < -.05 ? warp * 6 : 1);
      if (s.z <= .03) Object.assign(s, mk(1)); if (s.z > 1.05) Object.assign(s, mk(.06));
      const X = cx + s.x / s.z * F * .5, Y = cy + s.y / s.z * F * .5;
      if (X < -50 || X > W + 50 || Y < -50 || Y > H + 50) { Object.assign(s, mk(1)); continue; }
      const r = Math.max(.3, (1 - s.z) * 2.4), a = Math.min(1, (1 - s.z) * 1.3);
      if (Math.abs(warp) > .08) {
        const PX = cx + s.x / s.pz * F * .5, PY = cy + s.y / s.pz * F * .5;
        x1.strokeStyle = s.c; x1.globalAlpha = a * .8; x1.lineWidth = r; x1.beginPath(); x1.moveTo(PX, PY); x1.lineTo(X, Y); x1.stroke();
      }
      x1.globalAlpha = a; x1.fillStyle = s.c; x1.beginPath(); x1.arc(X, Y, r, 0, 6.283); x1.fill();
      if (s.z < .75) pts.push([X, Y, a, s.c]);
    }
    if (Math.abs(warp) < .3) {
      x1.lineWidth = .6;
      for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[i][0] - pts[j][0], dy = pts[i][1] - pts[j][1], d = dx * dx + dy * dy;
        if (d < 12000) { x1.globalAlpha = (1 - d / 12000) * .28 * Math.min(pts[i][2], pts[j][2]) * (1 - Math.abs(warp) * 3); x1.strokeStyle = '#7fdcff'; x1.beginPath(); x1.moveTo(pts[i][0], pts[i][1]); x1.lineTo(pts[j][0], pts[j][1]); x1.stroke(); }
      }
    }
    x1.globalAlpha = 1;
    // chispas
    x2.clearRect(0, 0, W, H);
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i]; p.life -= p.dec; if (p.life <= 0) { sparks.splice(i, 1); continue; }
      p.vx *= p.fr; p.vy = p.vy * p.fr + p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      x2.globalAlpha = Math.min(1, p.life * 1.4); x2.fillStyle = p.c;
      if (p.conf) { x2.save(); x2.translate(p.x, p.y); x2.rotate(p.rot); x2.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x2.restore(); }
      else { x2.shadowBlur = 10; x2.shadowColor = p.c; x2.beginPath(); x2.arc(p.x, p.y, p.s * p.life, 0, 6.283); x2.fill(); x2.shadowBlur = 0; }
    }
    x2.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  addEventListener('resize', size);
  addEventListener('pointermove', e => {
    px = e.clientX / W; py = e.clientY / H;
    if (FINE) { const s = $('#spot'); s.style.opacity = 1; s.style.transform = `translate(${e.clientX}px,${e.clientY}px)`; }
  }, {passive:true});
  document.addEventListener('visibilitychange', () => { run = !document.hidden; if (run) requestAnimationFrame(frame); });
  size(); requestAnimationFrame(frame);
  return {
    warp(v) { if (!REDUCED) warpT = v; },
    burst(x, y, n = 16, col) {
      if (REDUCED || x == null) return;
      for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = 2 + Math.random() * 5; sparks.push({x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v, g:.05, fr:.92, life:1, dec:.02 + Math.random() * .025, s:1.5 + Math.random() * 2.5, c: col || COLS[1 + (Math.random() * 5 | 0)], rot:0, vr:0}); }
    },
    confetti() {
      if (REDUCED) return;
      const cols = ['#ff6b1a', '#ffa04d', '#00e5ff', '#ff2bd6', '#8b5cf6', '#39ffb0', '#ffffff'];
      for (let k = 0; k < 3; k++) setTimeout(() => {
        for (let i = 0; i < 90; i++) { const left = Math.random() < .5, a = left ? -Math.PI / 3 - Math.random() * .6 : -2 * Math.PI / 3 + Math.random() * .6, v = 9 + Math.random() * 10;
          sparks.push({x:left ? 0 : W, y:H * .75, vx:Math.cos(a) * v, vy:Math.sin(a) * v, g:.22, fr:.985, life:1.6, dec:.006 + Math.random() * .006, s:7 + Math.random() * 7, c:cols[Math.random() * cols.length | 0], conf:true, rot:Math.random() * 6, vr:(Math.random() - .5) * .3}); }
      }, k * 380);
      for (let i = 0; i < 60; i++) { const a = Math.random() * 6.283, v = 3 + Math.random() * 9; sparks.push({x:W / 2, y:H * .3, vx:Math.cos(a) * v, vy:Math.sin(a) * v, g:.04, fr:.95, life:1.2, dec:.012, s:2.5, c:cols[i % cols.length], rot:0, vr:0}); }
    }
  };
})();

(function init() {
  $('#topLogo').src = LOGO_WORD;
  $('#ver').textContent = 'v' + VERSION;
  const tk = ['<b>UNIFRANZ</b>', 'REGISTRO DE MENTORÍAS', '<i>DOCENTES TUTORES</i>', 'HERMANOS MAYORES', '<i>HITOS 2 · 3 · 4</i>', 'ACOMPAÑAMIENTO ACADÉMICO', '<i>UN SOLO ENVÍO</i>', '<b>LA PAZ · EL ALTO · COCHABAMBA · SANTA CRUZ</b>'];
  const seq = tk.map(t => `<span>◆ ${t}</span>`).join('');
  $('#tickTrack').innerHTML = seq + seq;
  if (!API_OK) $('#bannerSlot').innerHTML = '<div class="banner"><div>Modo de prueba: el registro aún no está conectado a la base de datos. Cualquier correo @unifranz.edu.bo entra con datos ficticios y los envíos se guardan solo en este equipo.</div></div>';
  showWelcome();
  if (API_OK && cola().length) setTimeout(() => flushCola(), 2500);
  addEventListener('online', () => flushCola());
  if (QS.get('admin') === '1') setTimeout(openAdmin, 600);
})();
